services:
  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway@sha256:1bbdeb1bb467ee6546810733b3709c5146ad1cdc6cd2a486b6f75dcf35a67c75
    # All starts are owned by the lock-aware watchdog/FastAPI control plane.
    # Docker restart policies cannot consult the IBKR 2FA push lease.
    restart: "no"
    environment:
      TWS_USERID: ${TWS_USERID}
      TWS_PASSWORD_FILE: /run/secrets/ib_password
      TRADING_MODE: ${TRADING_MODE:-live}
      READ_ONLY_API: ${READ_ONLY_API:-no}
      # IMPORTANT: do NOT enable IBC-side auto-relogin on 2FA timeout.
      # Each relogin fires a fresh IBKR Mobile 2FA push; stacking pushes
      # within ~3 min causes IBKR's backend to reject every approval the
      # user taps. The radon stack governs restart cadence centrally via
      # scripts/utils/ib_2fa_lock.py + scripts/api/ib_gateway.py
      # (in-process backoff ladder) + scripts/ib_watchdog.py (sustained
      # api-hang detection). Both consult a shared 10-min push lock so
      # only one 2FA push is ever in flight at a time. Letting IBC
      # ALSO relogin on its own would bypass the lock.
      # `exit` makes IBC quit on 2FA timeout. The protocol-level watchdog
      # observes the down port and owns bounded, lock-aware recovery.
      TWOFA_TIMEOUT_ACTION: exit
      RELOGIN_AFTER_TWOFA_TIMEOUT: "no"
      EXISTING_SESSION_DETECTED_ACTION: primary
      # Blank both IBC schedules. Even a normally credential-preserving auto
      # restart becomes a full login at weekly token expiry and can mint a 2FA
      # push without Radon's lease. The lock-aware watchdog owns every cycle.
      AUTO_RESTART_TIME: ""
      TWS_COLD_RESTART: ""
      # DUR-08: GC logging does NOT work via JAVA_TOOL_OPTIONS — the image's
      # launcher blanks it before starting the JVM (verified on the java
      # process /proc environ). It lives instead in the persistent ib-config
      # volume: Jts/ibgateway/<ver>/ibgateway.vmoptions gets
      # `-Xlog:gc*:stdout:time,uptime,level,tags` (applied live 2026-06-13).
      VNC_SERVER_PASSWORD: ${VNC_SERVER_PASSWORD:-}
    ports:
      - "127.0.0.1:${IB_LIVE_PORT:-4001}:4003"
      - "127.0.0.1:${IB_PAPER_PORT:-4002}:4004"
    secrets:
      - ib_password
    volumes:
      - ib-gateway-settings:/home/ibgateway/Jts
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          case "$${TRADING_MODE:-live}" in
            live) port=4001 ;;
            paper) port=4002 ;;
            *) exit 1 ;;
          esac;
          exec bash -c "exec 3<>/dev/tcp/127.0.0.1/$${port}"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # NOTE: no autoheal sidecar. A blind `docker restart` on an unhealthy gateway
  # bypasses the cross-process 2FA push lock (scripts/utils/ib_2fa_lock.py) and
  # stacks IBKR Mobile pushes — IBKR's backend then rejects EVERY approval the
  # operator taps, locking them out of the live brokerage session. The unhealthy
  # case (API listener wedged while the process stays alive) is handled instead
  # by scripts/ib_watchdog.py, which acquires the push lock before restarting.
  # Autoheal also required a read-write /var/run/docker.sock mount = host-root on
  # the live-trading box, from an unpinned willfarrell/autoheal image. Removed
  # 2026-07-02 (security posture audit M1). See feedback_watchdog_works_dont_
  # deploy_autoheal + docs/ib-gateway-recovery.md (RELOGIN must stay "no").

secrets:
  ib_password:
    file: ${IB_PASSWORD_FILE:-./secrets/ib_password.txt}

volumes:
  ib-gateway-settings:
