title = "Radon Cloud secret scanning"

[extend]
useDefault = true

[[rules]]
id = "literal-tws-credential-assignment"
description = "Literal TWS credentials must never be committed"
regex = '''\bTWS_(?:USERID|PASSWORD)[ \t]*=[ \t]*["']?[A-Za-z0-9][A-Za-z0-9_.$!@#%^&*+:/=-]{3,}["']?'''
keywords = ["TWS_"]

[[rules.allowlists]]
description = "Vetted TWS literals in immutable pre-secret-scan commits"
commits = [
  "3ee6e6e8a50c24944c1983a75f5bf6dda9048f67",
  "c0ed4bfaae362621201f006e5ce7eef1c26e6047",
  "f66d78ff431e3d12b42fef55e81fca6c7d0e995a",
  "586e3270ba8eea1cf67235692d8e6a73595f2a3a",
  "40cfff2aba495320ee1bb4d8d179c362d909a46a",
  "af72046d0ce1d80417ccbc6ea150cbcb8c810505",
  "dfa5f948e4812376ebdd860d9b12e520c851488c",
  # Policy self-test fixtures that were rewritten to runtime construction.
  "65213d976eb3b4d835761c0b3f639581a533a27a",
  # 2026-07-18 audit report re-quoted the already-public TWS_USERID literal in a
  # finding description before the report was untracked from this public repo.
  # Immutable on protected main; the underlying value is tracked for rotation
  # (project_public_repo_leak_sweep_2026_07_05). Not a new exposure.
  "9142de46a09e367483ed57e1a323f1141bd106cc",
]

[[rules]]
id = "credential-shaped-example"
description = "Credential examples must use empty or named placeholders"
regex = '''(?i)\b(?:credential|password)s?\s+(?:example|like)\s*[:=]?\s*["'`]?[A-Za-z0-9][A-Za-z0-9_.$!@#%^&*+:/=-]{7,}["'`]?'''
keywords = ["credential", "password"]

[[rules.allowlists]]
description = "Vetted credential-shaped prose in immutable pre-secret-scan commits"
commits = [
  "3ee6e6e8a50c24944c1983a75f5bf6dda9048f67",
  "90daa01986c377ac20ba682021d77372fd030393",
  "25ef348f1eb882bdc4a7d735fd8e3206b2711c2e",
  # Policy self-test fixtures that were rewritten to runtime construction.
  "65213d976eb3b4d835761c0b3f639581a533a27a",
]

[allowlist]
description = "Generated local artifacts are not source"
paths = ['''(^|/)__pycache__/|\.pyc$|(^|/)\.venv/''']
