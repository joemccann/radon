title = "Radon Cloud secret scanning"

[extend]
useDefault = true

[[rules]]
id = "literal-tws-credential-assignment"
description = "Literal TWS credentials must never be committed"
regex = '''\bTWS_(?:USERID|PASSWORD)[ \t]*=[ \t]*["']?[A-Za-z0-9][A-Za-z0-9_.$!@#%^&*+:/=-]{3,}["']?'''
keywords = ["TWS_"]

[[rules.allowlists]]
description = "Vetted TWS literals in immutable pre-secret-scan commits"
commits = [
  "3ee6e6e8a50c24944c1983a75f5bf6dda9048f67",
  "c0ed4bfaae362621201f006e5ce7eef1c26e6047",
  "f66d78ff431e3d12b42fef55e81fca6c7d0e995a",
  "586e3270ba8eea1cf67235692d8e6a73595f2a3a",
  "40cfff2aba495320ee1bb4d8d179c362d909a46a",
  "af72046d0ce1d80417ccbc6ea150cbcb8c810505",
  "dfa5f948e4812376ebdd860d9b12e520c851488c",
  # Policy self-test fixtures that were rewritten to runtime construction.
  "65213d976eb3b4d835761c0b3f639581a533a27a",
  # 2026-07-18 audit report re-quoted the already-public TWS_USERID literal in a
  # finding description before the report was untracked from this public repo.
  # Immutable on protected main; the underlying value is tracked for rotation
  # (project_public_repo_leak_sweep_2026_07_05). Not a new exposure.
  "9142de46a09e367483ed57e1a323f1141bd106cc",
  # 2026-08-13: main was rebase-merged, so the two commits above were recreated
  # under new SHAs. These entries carry no new content -- the blobs are
  # identical to their pre-rebase originals:
  #   6ec11003 docs/security-audit-2026-07-18.html -> blob 32dd55bd (== 9142de46)
  #   da857b8b cloud/tests/test_gitleaks_policy.py -> blob 1d9a0955 (== 65213d97)
  # Keyed by SHA, this list is invalidated by any main rewrite; see
  # test_gitleaks_policy.py for the mirrored baseline.
  "6ec11003bb4521e7f7b677ffbd78b7fd4d09458a",
  "da857b8b19a6e5778bb86bf37465346dca8da89b",
  # 2026-08-30: PR #184's test fixture spelled a fake gateway password
  # (TWS_PASSWORD="p@ss word") to prove the env-file unquoting; merged before
  # the scan ran. Not a credential; the fixture was rewritten to runtime
  # construction in the next commit so no later SHA re-trips the rule.
  "020865adeff48b7182b7eb81d74a01fc70d00c82",
]

[[rules]]
id = "credential-shaped-example"
description = "Credential examples must use empty or named placeholders"
regex = '''(?i)\b(?:credential|password)s?\s+(?:example|like)\s*[:=]?\s*["'`]?[A-Za-z0-9][A-Za-z0-9_.$!@#%^&*+:/=-]{7,}["'`]?'''
keywords = ["credential", "password"]

[[rules.allowlists]]
description = "Vetted credential-shaped prose in immutable pre-secret-scan commits"
commits = [
  "3ee6e6e8a50c24944c1983a75f5bf6dda9048f67",
  "90daa01986c377ac20ba682021d77372fd030393",
  "25ef348f1eb882bdc4a7d735fd8e3206b2711c2e",
  # Policy self-test fixtures that were rewritten to runtime construction.
  "65213d976eb3b4d835761c0b3f639581a533a27a",
  # 2026-08-13 rebase of main recreated the fixture commit above under a new
  # SHA; blob 1d9a0955 is byte-identical to 65213d97's.
  "da857b8b19a6e5778bb86bf37465346dca8da89b",
]

# Global allowlists. The singular legacy `[allowlist]` table cannot coexist
# with this array, so both entries live here.
[[allowlists]]
description = "Generated local artifacts are not source"
paths = ['''(^|/)__pycache__/|\.pyc$|(^|/)\.venv/''']
# RADON_DB_NO_REPLICA=1 is the documented replica kill-switch flag (root
# CLAUDE.md, docs). Prose like ".env with dummy Clerk keys,
# `RADON_DB_NO_REPLICA=1`" trips generic-api-key (2026-08-16, .pi/AGENTS.md
# in b2ef3209). The literal is config, never a credential.
regexes = ['''RADON_DB_NO_REPLICA=1''']

# generic-api-key is a gitleaks DEFAULT rule, so its exception cannot live
# under a [[rules]] block here. `targetRules` keeps this scoped to that one
# rule instead of blanket-allowing the commit (gitleaks >= 8.19).
[[allowlists]]
description = "Vetted test fixture in an immutable merged commit"
targetRules = ["generic-api-key"]
commits = [
  # 2026-08-31 (#212): the weekend-redactor test spelled a FAKE UW token to
  # prove the redactor scrubs env values; merged before the scan ran. Never a
  # valid credential, nothing to rotate. The fixture was rewritten to runtime
  # construction in the next commit so no later SHA re-trips the rule.
  "38eeecb91eedb3b90966821bff12d5b240d89708",
  # 2026-09-02 (PR #125): the secret-store tests spelled FAKE sample values
  # ("uw-abc123secret" and friends) next to *_TOKEN/*_KEY identifiers to
  # prove roundtrip/masking/audit behavior. Never valid credentials, nothing
  # to rotate. The fixtures were rewritten to runtime construction in the
  # follow-up commit so no later SHA re-trips the rule.
  "fd1eb140d324cf8b61373723ee34a744a0ddaab2",
]
