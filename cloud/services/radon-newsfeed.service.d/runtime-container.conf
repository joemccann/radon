[Service]
User=root
NotifyAccess=all
Environment=RADON_RUNTIME=container
# The drop-in makes this a User=root unit, so it owes the same explicit
# PATH every other root unit pins -- a root process must not resolve a
# bare binary name through an inherited PATH. R-393.
Environment=PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
Type=simple
WatchdogSec=infinity
# REL-087: podman --cgroups=split puts conmon and the container in this
# unit's own cgroup; Delegate lets it create the sub-cgroup, and mixed sends
# SIGTERM to the main process then SIGKILLs every leftover PID in the unit.
Delegate=yes
KillMode=mixed
ExecStartPre=
ExecStart=
ExecStart=/usr/local/sbin/radon-app-runtime run %n
ExecStopPost=/usr/local/sbin/radon-app-runtime stop %n
