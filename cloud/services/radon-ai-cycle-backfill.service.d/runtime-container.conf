[Service]
# DS-2026-10-05-05: this unit loads the secret-store master key, so it runs
# the image through the root-owned wrapper, never the radon-writable venv as
# User=radon. The wrapper stages the key root:radon-secrets 0040 for this
# container only; the radon account cannot open it.
User=root
NotifyAccess=all
Environment=RADON_RUNTIME=container
# The drop-in makes this a User=root unit, so it owes the same explicit
# PATH every other root unit pins. R-393.
Environment=PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
Type=oneshot
# REL-087: podman --cgroups=split puts conmon and the container in this
# unit's own cgroup; Delegate lets it create the sub-cgroup, and mixed sends
# SIGTERM to the main process then SIGKILLs every leftover PID in the unit.
Delegate=yes
KillMode=mixed
ExecStartPre=
ExecStart=
ExecStart=/usr/local/sbin/radon-app-runtime run %n
# A oneshot runs ExecStop as soon as its ExecStart exits, where halt finds no
# container and returns 0; it still stops a container that outlived its run.
ExecStop=/usr/local/sbin/radon-app-runtime halt %n 30
ExecStopPost=/usr/local/sbin/radon-app-runtime stop %n
