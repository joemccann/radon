# Installed to /etc/systemd/journald.conf.d/radon.conf by setup-vps.sh
# (install_journald_limits). Apply by restarting systemd-journald.
#
# DUR-02 (2026-06-12): cap journald disk usage. The radon-beta-nextjs crash
# loop (160k restarts) grew /var/log/journal to 3.9G on a 75G disk with no
# SystemMaxUse configured (default = 10% of fs). 1G keeps ~weeks of radon
# logs at normal volume and bounds the damage of any future log flood.
[Journal]
SystemMaxUse=1G
