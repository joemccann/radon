# Fleet-wide invariants for every radon-*.service (systemd prefix drop-in;
# systemd v250+ matches "radon-.service.d" against all units named radon-*).
# Installed by setup-vps.sh:install_fleet_dropin from radon-cloud
# services/radon-.service.d/common.conf — edit there, not here.
#
# RADON_DB_NO_REPLICA=1: belt-and-suspenders kill switch for the libsql
# embedded replica (retired 2026-05-20). Since DUR-07 the code default is
# direct-to-cloud (opt-in only via RADON_DB_USE_REPLICA=1); this guarantees
# no radon unit can ever resurrect data/replica.db even if a future change
# regresses the default (the ib-watchdog 6h hang, 2026-06-10).
[Service]
Environment=RADON_DB_NO_REPLICA=1
