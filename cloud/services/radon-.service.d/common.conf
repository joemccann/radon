# Fleet-wide invariants for every radon-*.service (systemd prefix drop-in;
# systemd v250+ matches "radon-.service.d" against all units named radon-*).
# Installed by setup-vps.sh:install_fleet_dropin from radon-cloud
# services/radon-.service.d/common.conf — edit there, not here.
[Service]
# All application inference uses the private gateway, including host oneshots.
# Consumer code fails closed if it is unavailable; model secrets are owned
# by the gateway's filtered container environment, never worker processes.
Environment=RADON_MODEL_GATEWAY_SOCKET=/run/radon-model-gateway/gateway.sock
Environment=RADON_MODEL_GATEWAY_REQUIRED=1
UnsetEnvironment=CLAUDE_CODE_OAUTH_TOKEN CLAUDE_CODE_OAUTH_TOKEN_FILE ANTHROPIC_API_KEY CLAUDE_API_KEY CLAUDE_CODE_API_KEY XAI_API_KEY GROK_API_KEY OPENAI_API_KEY GOOGLE_API_KEY GEMINI_API_KEY NVIDIA_API_KEY CEREBRAS_API_KEY CURSOR_API_KEY GOOGLE_APPLICATION_CREDENTIALS CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN GROK_AUTH_FILE CODEX_HOME CLAUDE_CONFIG_DIR
