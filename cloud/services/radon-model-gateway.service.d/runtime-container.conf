[Service]
# Model credentials terminate in this immutable managed container.
User=root
NotifyAccess=all
Environment=RADON_RUNTIME=container
Environment=PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
Type=simple
WatchdogSec=infinity
Delegate=yes
KillMode=mixed
ExecStartPre=
ExecStart=
ExecStart=/usr/local/sbin/radon-app-runtime run %n
ExecStartPost=
ExecStartPost=/usr/bin/setpriv --reuid=radon --regid=radon --clear-groups /usr/bin/curl --fail --silent --show-error --unix-socket /run/radon-model-gateway/gateway.sock --retry 30 --retry-delay 1 --retry-all-errors --retry-max-time 45 --max-time 2 http://localhost/health
ExecStop=/usr/local/sbin/radon-app-runtime halt %n 30
ExecStopPost=/usr/local/sbin/radon-app-runtime stop %n

# CPU specialist models stay out of ordinary API consumers.
MemoryHigh=3G
MemoryMax=4G
