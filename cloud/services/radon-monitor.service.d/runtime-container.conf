[Service]
User=root
NotifyAccess=all
Environment=RADON_RUNTIME=container
# The drop-in makes this a User=root unit, so it owes the same explicit
# PATH every other root unit pins -- a root process must not resolve a
# bare binary name through an inherited PATH. R-393.
Environment=PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
# The base unit is Type=notify with WatchdogSec (DUR-17 for the relay,
# REL-008 for the monitor, installed to catch the alive-but-dead loop wedge).
# Forcing Type=simple + WatchdogSec=infinity here made systemd stop waiting
# for READY=1 and stop requiring keepalives, so a relay that stopped
# delivering ticks sat active (running) forever with a dead socket (R-391).
# systemd attributes a notify datagram by the SENDER's cgroup, and the
# container's PIDs live in system.slice/docker-<id>.scope, so a datagram
# sent from inside the container is dropped whatever NotifyAccess= says:
# under Type=notify the relay timed out twice on 2026-08-29. It works only
# because radon-app-runtime.sh spawns `notify-proxy` inside the unit cgroup
# and hands the container THAT socket as NOTIFY_SOCKET (R-429). Do not set
# Type=notify on a unit whose ExecStart is not radon-app-runtime.
Type=notify
WatchdogSec=900
ExecStartPre=
ExecStart=
ExecStart=/usr/local/sbin/radon-app-runtime run %n
ExecStopPost=/usr/local/sbin/radon-app-runtime stop %n
