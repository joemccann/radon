services:
  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway@sha256:1bbdeb1bb467ee6546810733b3709c5146ad1cdc6cd2a486b6f75dcf35a67c75
    container_name: ib-gateway
    # Restart ownership is centralized in scripts/ib_watchdog.py, which applies
    # the persisted failure threshold, 2FA push lock, and bounded backoff/cap.
    # Docker must not independently relaunch a timed-out login and mint another
    # push outside that control plane.
    restart: "no"

    env_file:
      - ${RADON_COMPOSE_ENV_FILE:-.env}

    environment:
      - VNC_SERVER_PASSWORD=${VNC_SERVER_PASSWORD:-}
      - EXISTING_SESSION_DETECTED_ACTION=${EXISTING_SESSION_DETECTED_ACTION:-primary}
      # Exit after an unattended 2FA timeout and leave relaunch ownership to the
      # watchdog. Relogin retries inside IBC would bypass the same push lock.
      - TWOFA_TIMEOUT_ACTION=exit
      - RELOGIN_AFTER_TWOFA_TIMEOUT=no
      # IBC must not independently cycle the session and mint an unleased 2FA
      # push. All scheduled/cold recovery belongs to the lease-aware watchdog.
      - AUTO_RESTART_TIME=
      - TWS_COLD_RESTART=

    # 4001 is bound to loopback (combined/broker FastAPI or the helper) and to
    # the Tailscale interface IP (laptop). It is NOT published on the public
    # NIC. IB_GATEWAY_TAILSCALE_BIND defaults to the current Ashburn tailnet
    # address; a rebuilt node or a dedicated broker VM must set the new 100.x
    # in /etc/radon/env. Production app-to-broker orders after the host split
    # use a Hetzner private-net bind documented in docs/spof-host-split.md,
    # not this Tailscale port.
    ports:
      - "127.0.0.1:4001:4003"
      - "${IB_GATEWAY_TAILSCALE_BIND:-100.112.32.16}:4001:4003"
      - "127.0.0.1:4002:4004"
      - "127.0.0.1:5900:5900"

    volumes:
      - ib-config:/home/ibgateway/Jts

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          case "$${TRADING_MODE:-paper}" in
            live) port=4001 ;;
            paper) port=4002 ;;
            *) exit 1 ;;
          esac;
          exec bash -c "exec 3<>/dev/tcp/127.0.0.1/$${port}"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    security_opt:
      - no-new-privileges:true

    privileged: false

    ulimits:
      nofile:
        soft: 10240
        hard: 10240

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ib-config:
