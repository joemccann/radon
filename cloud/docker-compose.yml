services:
  ib-gateway:
    # IB Gateway 10.50.1f, IBC 3.24.2 (gnzsnz `stable` = `10.50.1f`). IBKR
    # drops support for builds below 10.50.1 on 2026-12-15.
    image: ghcr.io/gnzsnz/ib-gateway@sha256:1e2236804ac949b789197c225a048c0c891c9958f948c87166226e5b647ff581
    container_name: ib-gateway
    # Restart ownership is centralized in scripts/ib_watchdog.py, which applies
    # the persisted failure threshold, 2FA push lock, and bounded backoff/cap.
    # Docker must not independently relaunch a timed-out login and mint another
    # push outside that control plane.
    restart: "no"

    env_file:
      - ${RADON_COMPOSE_ENV_FILE:-.env}

    environment:
      - VNC_SERVER_PASSWORD=${VNC_SERVER_PASSWORD:-}
      # primaryoverride: when the operator logs in to IBKR Mobile / the web
      # portal with the username this Gateway shares, IBC yields the session
      # (scenario 6) instead of reclaiming it (primary, 2026-09-25), and the
      # watchdog sets the operator hold so nothing logs back in. A fresh
      # Gateway login still takes the session, so 2FA recovery is unchanged.
      # Pinned, not env-overridable: an old `primary` in /etc/radon/env must
      # not quietly bring the fight back.
      - EXISTING_SESSION_DETECTED_ACTION=primaryoverride
      # Exit after an unattended 2FA timeout and leave relaunch ownership to the
      # watchdog. Relogin retries inside IBC would bypass the same push lock.
      - TWOFA_TIMEOUT_ACTION=exit
      - RELOGIN_AFTER_TWOFA_TIMEOUT=no
      # The Gateway insists on a daily cycle; blank does not disable it, it
      # keeps the stored 11:45 PM (container UTC) default, which ran as a full
      # re-login and a watchdog 2FA push every night. Pinning AUTO_RESTART_TIME
      # makes that cycle a token restart with no push; only weekly token expiry
      # needs 2FA, at 23:45Z (4:45 PM PT), inside the watchdog's 23:40-00:15
      # quiet window. Not 09:05 AM: that slot pushed at 02:05 PT (2026-07-05).
      # Format is IBC's `HH:MM AM/PM`; anything else is silently ignored.
      - AUTO_RESTART_TIME=11:45 PM
      - TWS_COLD_RESTART=

    # 4001 is bound to loopback (combined/broker FastAPI or the helper) and to
    # the Tailscale interface IP (laptop). It is NOT published on the public
    # NIC. IB_GATEWAY_TAILSCALE_BIND defaults to the current Ashburn tailnet
    # address; a rebuilt node or a dedicated broker VM must set the new 100.x
    # in /etc/radon/env. Production app-to-broker orders after the host split
    # use a Hetzner private-net bind documented in docs/spof-host-split.md,
    # not this Tailscale port.
    ports:
      - "127.0.0.1:4001:4003"
      - "${IB_GATEWAY_TAILSCALE_BIND:-100.112.32.16}:4001:4003"
      - "127.0.0.1:4002:4004"
      - "127.0.0.1:5900:5900"

    volumes:
      - ib-config:/home/ibgateway/Jts

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          case "$${TRADING_MODE:-paper}" in
            live) port=4001 ;;
            paper) port=4002 ;;
            *) exit 1 ;;
          esac;
          exec bash -c "exec 3<>/dev/tcp/127.0.0.1/$${port}"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    security_opt:
      - no-new-privileges:true

    privileged: false

    ulimits:
      nofile:
        soft: 10240
        hard: 10240

    # journald, not json-file: a watchdog restart recreates the container and
    # json-file logs die with it, so the 2026-10-04 23:45Z weekly re-auth left
    # no record past a 3s forensic fragment. journald keeps them on the host
    # (`journalctl CONTAINER_TAG=ib-gateway`), bounded by journald retention;
    # `docker logs` and the shim's `logs` verb still read them.
    logging:
      driver: journald
      options:
        tag: ib-gateway

volumes:
  ib-config:
