name: Cloud CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: pytest (full cloud suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install --requirement requirements-test.txt
      - name: Run full suite
        run: python -m pytest -q

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          version="8.30.1"
          sha256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          echo "${sha256}  gitleaks.tar.gz" | sha256sum --check --status
          tar -xz -C /usr/local/bin -f gitleaks.tar.gz gitleaks
          rm -f gitleaks.tar.gz
      - name: Scan full cloud history
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner --verbose
