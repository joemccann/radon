# Deliberate, operator-acknowledged config drift (read by scripts/drift_audit.py).
#
# Format: one entry per line -- `<drift-id> expires=YYYY-MM-DD <reason...>`.
# The drift-id is the exact id the audit reports (e.g.
# `unit-mismatch:radon-api.service`). Matched, UNEXPIRED drifts are reported
# as "allowlisted-pending" and do NOT flip the config-drift service_health
# row to error.
#
# R-058 ratchet -- an entry is a bounded acknowledgment, never a permanent
# silencer:
#   * past its expiry date the underlying drift SURFACES again (state=error
#     with the pending unit named); renew the date deliberately or ship the
#     install.
#   * an entry without a valid expires= is never honored.
#   * an entry matching no observed drift raises `stale-allowlist:<id>`;
#     remove it the moment the underlying drift is reconciled.
#
# radon-beta-* unit files are NOT listed here -- the audit hardcodes them as
# "known-untracked" (beta keep-vs-delete is an open operator decision).

# Repo unit adds tailscaled.service ordering (After/Wants). Installing it
# means restarting radon-ib-gateway -> a 2FA push; apply at the next planned
# gateway window, then drop this line.
unit-mismatch:radon-ib-gateway.service expires=2026-09-30 repo adds tailscaled ordering; awaiting next planned gateway restart (2FA push)

# Repo timer modernised Description text only; OnCalendar semantics are
# identical. Converges at the next unit reinstall.
unit-mismatch:radon-vcg-refresh.timer expires=2026-09-30 Description text only; semantics identical

# Repo service carries [Install] WantedBy=multi-user.target (the test suite
# requires the section); the live install dropped it -- the unit is fired by
# radon-vcg-refresh.timer, so enablement semantics are unaffected.
unit-mismatch:radon-vcg-refresh.service expires=2026-09-30 Install-section only; unit is timer-driven

# llm-token-index is gated on the Artificial Analysis signup (see main repo
# memory project_llm_token_index_2026_05_19) -- units committed, not installed.
not-installed:radon-llm-index.service expires=2026-12-31 gated on Artificial Analysis signup; deliberately not installed
not-installed:radon-llm-index.timer expires=2026-12-31 gated on Artificial Analysis signup; deliberately not installed


