# radon-perf-twr is a NEW scheduler pair (the TWR builder had no caller at
# all, which is why a stale v1 snapshot served the page forever). The install
# is HELD on an IBKR Flex throttle gate, not on the mechanical root step:
#
#   * perf_twr_builder.py resolves both its NAV and its flows query from
#     IB_FLEX_NAV_QUERY_ID (IB_FLEX_FLOWS_QUERY_ID is unset on the host), so it
#     would become a THIRD consumer of that one query id, alongside the
#     monitor_daemon cash_flow_sync handler (17:00 ET daily) and
#     portfolio_performance.py (on demand, up to 2 SendRequests per rebuild).
#   * cash_flow_sync's breaker is at throttle_count=3 (verified 2026-08-16 in
#     data/daemon_state.json). The ladder is 24h/48h/72h/168h, so the NEXT
#     Flex throttle hit costs a full week and blanks the performance page.
#   * The throttle counter only resets on a SUCCESSFUL Flex pull. cash_flow_sync
#     has not had one since 2026-08-06; its next attempt is Mon 17:00 ET.
#
# Re-evaluate after cash_flow_sync lands a clean run and throttle_count is back
# to 0, and after the builder's single-fetch document reuse is what actually
# runs on the host. Manifest entries are deliberately NOT pre-recorded for this
# pair so nothing here can be mistaken for an install.
not-installed:radon-perf-twr.service expires=2026-10-31 new TWR builder scheduler; HELD on Flex throttle gate (breaker at 3/4)
not-installed:radon-perf-twr.timer expires=2026-10-31 new TWR builder scheduler; HELD on Flex throttle gate (breaker at 3/4)
