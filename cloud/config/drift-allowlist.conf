# Deliberate, operator-acknowledged config drift (read by scripts/drift_audit.py).
#
# Format: one entry per line -- `<drift-id> <reason...>`. The drift-id is the
# exact id the audit reports (e.g. `unit-mismatch:radon-api.service`). Matched
# drifts are reported as "allowlisted" and do NOT flip the config-drift
# service_health row to error. Remove an entry the moment the underlying
# drift is reconciled, or the audit goes blind to a real regression there.
#
# radon-beta-* unit files are NOT listed here -- the audit hardcodes them as
# "known-untracked" (beta keep-vs-delete is an open operator decision).

# Repo unit adds tailscaled.service ordering (After/Wants). Installing it
# means restarting radon-ib-gateway -> a 2FA push; apply at the next planned
# gateway window, then drop this line.
unit-mismatch:radon-ib-gateway.service repo adds tailscaled ordering; awaiting next planned gateway restart (2FA push)

# Repo timer modernised Description text only; OnCalendar semantics are
# identical. Converges at the next unit reinstall.
unit-mismatch:radon-vcg-refresh.timer Description text only; semantics identical

# Repo service carries [Install] WantedBy=multi-user.target (the test suite
# requires the section); the live install dropped it -- the unit is fired by
# radon-vcg-refresh.timer, so enablement semantics are unaffected.
unit-mismatch:radon-vcg-refresh.service Install-section only; unit is timer-driven

# llm-token-index is gated on the Artificial Analysis signup (see main repo
# memory project_llm_token_index_2026_05_19) -- units committed, not installed.
not-installed:radon-llm-index.service gated on Artificial Analysis signup; deliberately not installed
not-installed:radon-llm-index.timer gated on Artificial Analysis signup; deliberately not installed

# skew2d units land in this commit; root install-copy still owed at next VPS
# unit reinstall (setup-vps.sh SERVICE_FILES already lists them).
not-installed:radon-skew2d.service pending root install-copy with next unit reinstall
not-installed:radon-skew2d.timer pending root install-copy with next unit reinstall

# Security scan 2026-08-11 (F1/F2): neither unit executes radon-writable code
# as root any more. The drift audit runs the root-owned control-plane copy at
# /usr/local/lib/radon/drift_audit.py and takes the checkout as an argument;
# the Next.js DB probe dropped to User=radon and reaches root only through the
# argument-validating operator restart rule. Both are control-plane bundle
# members, and the new audit target installs in the SAME atomic transaction as
# the unit that points at it, so there is no window where the unit references a
# missing payload. Drop these two lines after the next
# bootstrap-control-plane.sh run.
unit-mismatch:radon-drift-audit.service root payload relocated out of the checkout; pending control-plane bootstrap install
unit-mismatch:radon-nextjs-db-watchdog.service dropped to User=radon with a sudo-scoped restart; pending control-plane bootstrap install

# Security scan 2026-08-11: radon-caddy dropped the raw `cp <checkout
# Caddyfile> /etc/caddy/Caddyfile` capability (symlinked source = arbitrary
# root read; unvalidated edge config = X-Forwarded-* stripping) for the fixed
# `radon-deploy-root publish-caddy` action. Converges at the same bootstrap.
file-mismatch:sudoers/radon-caddy raw cp capability replaced by the fixed publish-caddy action; pending control-plane bootstrap install

