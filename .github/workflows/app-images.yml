name: App-plane images

# Builds radon-python / radon-node as sibling jobs so wall clock is the
# slower image, not python+node+four sequential pushes. Each image exports
# both registry tags in one BuildKit operation. Main writes an isolated
# registry build cache on that same package (tag buildcache, never a deploy
# ref). Pull requests keep an isolated GHA cache because this workflow's
# pull_request caller has no packages:write token.
# Main CI calls this workflow and gates deploy on the exact SHA pair. Pull
# requests invoke it directly as a build-only image contract.

# workflow_call only: the token here is always the CALLER's grant. ci.yml
# grants packages:write for the main-push publish; app-images-pr.yml grants
# contents:read only, so the pull_request build path never holds a token
# that can write GHCR.
on:
  workflow_call:

concurrency:
  group: app-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-image:
    name: Build python image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare build context
        run: cp docker/app/.dockerignore .dockerignore
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Select image cache
        id: image-cache
        env:
          IMAGE_REPO: ghcr.io/joemccann/radon-python
          GHA_SCOPE: radon-python
        run: |
          set -euo pipefail
          # GHA cache export kept this job, and deploy behind it, after GHCR
          # already had the exact SHA (403s on run 37664940638, 104s on run
          # 37472489871). Registry cache mounts those blobs. buildcache is
          # not a deploy tag. PRs cannot push packages, so they stay on GHA.
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$GITHUB_EVENT_NAME" = "push" ]; then
            # Missing buildcache is the steady state until the first export.
            # A failed inspect must not fail the publish; GHA remains readable.
            cache_from="type=gha,scope=${GHA_SCOPE}"
            if docker buildx imagetools inspect "${IMAGE_REPO}:buildcache" >/dev/null 2>&1; then
              cache_from="type=registry,ref=${IMAGE_REPO}:buildcache"$'\n'"type=gha,scope=${GHA_SCOPE}"
            fi
            {
              echo "cache_from<<EOF"
              printf '%s\n' "$cache_from"
              echo "EOF"
              echo "cache_to=type=registry,ref=${IMAGE_REPO}:buildcache,mode=max"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "cache_from<<EOF"
              echo "type=gha,scope=${GHA_SCOPE}"
              echo "EOF"
              echo "cache_to=type=gha,mode=max,scope=${GHA_SCOPE}"
            } >> "$GITHUB_OUTPUT"
          fi
      - name: Build and publish python image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/app/Dockerfile.python
          platforms: linux/amd64
          load: true
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: |
            ghcr.io/joemccann/radon-python:${{ github.sha }}
            ghcr.io/joemccann/radon-python:latest
          cache-from: ${{ steps.image-cache.outputs.cache_from }}
          cache-to: ${{ steps.image-cache.outputs.cache_to }}
          provenance: false
      - name: Smoke hardened Python browser runtime
        run: |
          docker run --rm --pull=never --init --user 1000:1000 --network none \
            --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint python \
            ghcr.io/joemccann/radon-python:${{ github.sha }} \
            -c "from playwright.sync_api import sync_playwright; p = sync_playwright().start(); browser = p.chromium.launch(headless=True); page = browser.new_page(); page.set_content('<title>radon-browser-smoke</title>'); assert page.title() == 'radon-browser-smoke'; browser.close(); p.stop()"

  node-image:
    name: Build node image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate public build environment
        env:
          # NEXT_PUBLIC_* are COMPILE-TIME inlined by the Next build, so an
          # unset build arg ships an empty string into the client bundle and
          # radon-app-runtime's --env-file cannot repair it at runtime: no
          # Clerk publishable key and no API base URL for every browser
          # session. The host-plane path gets this right via deploy.sh's
          # write_web_env; the image path did not. R-233.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_RADON_API_URL: ${{ vars.NEXT_PUBLIC_RADON_API_URL }}
          NEXT_PUBLIC_IB_REALTIME_WS_URL: ${{ vars.NEXT_PUBLIC_IB_REALTIME_WS_URL }}
        run: |
          set -euo pipefail
          for name in NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY NEXT_PUBLIC_RADON_API_URL NEXT_PUBLIC_IB_REALTIME_WS_URL; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is empty; the client bundle would ship without it" >&2
              exit 1
            fi
          done
      - name: Prepare build context
        run: cp docker/app/.dockerignore .dockerignore
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Select image cache
        id: image-cache
        env:
          IMAGE_REPO: ghcr.io/joemccann/radon-node
          GHA_SCOPE: radon-node
        run: |
          set -euo pipefail
          # Same boundary as the python image: do not hold the exact-SHA
          # publish on a GHA cache upload. buildcache is not a deploy tag.
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$GITHUB_EVENT_NAME" = "push" ]; then
            # Missing buildcache is the steady state until the first export.
            # A failed inspect must not fail the publish; GHA remains readable.
            cache_from="type=gha,scope=${GHA_SCOPE}"
            if docker buildx imagetools inspect "${IMAGE_REPO}:buildcache" >/dev/null 2>&1; then
              cache_from="type=registry,ref=${IMAGE_REPO}:buildcache"$'\n'"type=gha,scope=${GHA_SCOPE}"
            fi
            {
              echo "cache_from<<EOF"
              printf '%s\n' "$cache_from"
              echo "EOF"
              echo "cache_to=type=registry,ref=${IMAGE_REPO}:buildcache,mode=max"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "cache_from<<EOF"
              echo "type=gha,scope=${GHA_SCOPE}"
              echo "EOF"
              echo "cache_to=type=gha,mode=max,scope=${GHA_SCOPE}"
            } >> "$GITHUB_OUTPUT"
          fi
      - name: Build and publish node image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/app/Dockerfile.node
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: |
            ghcr.io/joemccann/radon-node:${{ github.sha }}
            ghcr.io/joemccann/radon-node:latest
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_RADON_API_URL=${{ vars.NEXT_PUBLIC_RADON_API_URL }}
            NEXT_PUBLIC_IB_REALTIME_WS_URL=${{ vars.NEXT_PUBLIC_IB_REALTIME_WS_URL }}
          cache-from: ${{ steps.image-cache.outputs.cache_from }}
          cache-to: ${{ steps.image-cache.outputs.cache_to }}
          provenance: false
