name: App-plane images

# Builds radon-python / radon-node as sibling jobs so wall clock is the
# slower image, not python+node+four sequential pushes. Each image exports
# both registry tags in one BuildKit operation. Main writes an isolated
# registry build cache on that same package (tag buildcache, never a deploy
# ref). Pull requests keep an isolated GHA cache because this workflow's
# pull_request caller has no packages:write token.
# Main CI calls this workflow and gates deploy on the exact SHA pair. Pull
# requests invoke it directly as a build-only image contract.

# workflow_call only: the token here is always the CALLER's grant. ci.yml
# grants packages:write for the main-push publish; app-images-pr.yml grants
# contents:read only, so the pull_request build path never holds a token
# that can write GHCR.
on:
  workflow_call:

concurrency:
  group: app-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-image:
    needs: darwin-clients
    name: Build python image
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify model-only SSH and read-only export boundary
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openssh-server
          sudo env GITHUB_ACTIONS=true python3 -I cloud/scripts/check_model_transport.py
      - name: Prepare build context
        run: cp docker/app/.dockerignore .dockerignore
      # Private 7.7GB runners still ENOSPC while Docker loads the image
      # (#1330). ubuntu-24.04 main runs already have ~86 GiB free; deleting
      # the preinstalled toolchains there costs 69-339s and becomes the
      # deploy authorizer. Unknown or low free space still deletes.
      - name: Free runner disk
        run: |
          df -h /
          avail_kb="$(df -Pk / | awk 'NR==2 { print $4 }')"
          threshold_kb=$((40 * 1024 * 1024))
          if printf '%s' "$avail_kb" | grep -Eq '^[0-9]+$' && [ "$avail_kb" -ge "$threshold_kb" ]; then
            echo "disk already has ${avail_kb} KiB free; skipping toolchain delete"
          else
            echo "free space ${avail_kb:-unknown} KiB is below ${threshold_kb}; deleting preinstalled toolchains"
            sudo rm -rf /usr/local/lib/android || true
            sudo rm -rf /usr/share/dotnet || true
            sudo rm -rf /opt/ghc || true
            sudo rm -rf /usr/local/.ghcup || true
            sudo rm -rf /opt/hostedtoolcache/CodeQL || true
            docker system prune -af || true
          fi
          df -h /
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Hash python image inputs
        id: pyimage
        # A non-zero hash is fail-closed: reuse stays a miss and the build
        # below runs. Web-only commits that do not touch these inputs keep
        # the same digest (run 38597907211 still exported a 53.9s tarball).
        run: |
          set -euo pipefail
          if hash="$(python3 scripts/ci/python_image_inputs.py)"; then
            echo "hash=${hash}" >> "$GITHUB_OUTPUT"
            echo "tag=ghcr.io/joemccann/radon-python:ihash-${hash}" >> "$GITHUB_OUTPUT"
          else
            echo "hash=" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "python image input hash refused; building"
          fi
      - name: Reuse identical python image
        id: reuse
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set -euo pipefail
          source="${{ steps.pyimage.outputs.tag }}"
          sha_tag="ghcr.io/joemccann/radon-python:${{ github.sha }}"
          latest_tag="ghcr.io/joemccann/radon-python:latest"
          if [ -z "$source" ]; then
            echo "hit=false" >> "$GITHUB_OUTPUT"
            echo "python image input hash unavailable; building"
            exit 0
          fi
          if ! printf '%s\n' "$source" | grep -Eq '^ghcr.io/joemccann/radon-python:ihash-[0-9a-f]{64}$'; then
            echo "refusing an input-hash tag outside radon-python:ihash-<64 hex>" >&2
            exit 1
          fi
          if ! docker buildx imagetools inspect "$source" >/dev/null 2>&1; then
            echo "hit=false" >> "$GITHUB_OUTPUT"
            echo "no smoked image for ${source}; building"
            exit 0
          fi
          source_raw="$(docker buildx imagetools inspect "$source" --raw | sha256sum | awk 'NR==1 { print $1 }')"
          docker buildx imagetools create -t "$sha_tag" -t "$latest_tag" "$source"
          dest_raw="$(docker buildx imagetools inspect "$sha_tag" --raw | sha256sum | awk 'NR==1 { print $1 }')"
          if [ -z "$source_raw" ] || [ "$source_raw" != "$dest_raw" ]; then
            echo "retagged manifest bytes do not match the input-hash image" >&2
            exit 1
          fi
          echo "hit=true" >> "$GITHUB_OUTPUT"
          echo "reused ${source} as ${sha_tag}"
      - name: Select image cache
        id: image-cache
        if: steps.reuse.outputs.hit != 'true'
        env:
          IMAGE_REPO: ghcr.io/joemccann/radon-python
          GHA_SCOPE: radon-python
        run: |
          set -euo pipefail
          # GHA cache export kept this job, and deploy behind it, after GHCR
          # already had the exact SHA (403s on run 37664940638, 104s on run
          # 37472489871). Registry cache mounts those blobs. buildcache is
          # not a deploy tag. PRs cannot push packages, so they stay on GHA.
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$GITHUB_EVENT_NAME" = "push" ]; then
            # Missing buildcache is the steady state until the first export.
            # A failed inspect must not fail the publish; GHA remains readable.
            cache_from="type=gha,scope=${GHA_SCOPE}"
            if docker buildx imagetools inspect "${IMAGE_REPO}:buildcache" >/dev/null 2>&1; then
              cache_from="type=registry,ref=${IMAGE_REPO}:buildcache"$'\n'"type=gha,scope=${GHA_SCOPE}"
            fi
            {
              echo "cache_from<<EOF"
              printf '%s\n' "$cache_from"
              echo "EOF"
              echo "cache_to=type=registry,ref=${IMAGE_REPO}:buildcache,mode=max"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "cache_from<<EOF"
              echo "type=gha,scope=${GHA_SCOPE}"
              echo "EOF"
              echo "cache_to=type=gha,mode=max,scope=${GHA_SCOPE}"
            } >> "$GITHUB_OUTPUT"
          fi
      - name: Build and publish python image
        if: steps.reuse.outputs.hit != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/app/Dockerfile.python
          platforms: linux/amd64
          load: true
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: |
            ghcr.io/joemccann/radon-python:${{ github.sha }}
            ghcr.io/joemccann/radon-python:latest
          cache-from: ${{ steps.image-cache.outputs.cache_from }}
          cache-to: ${{ steps.image-cache.outputs.cache_to }}
          provenance: false
      - name: Smoke hardened Python browser runtime
        if: steps.reuse.outputs.hit != 'true'
        run: |
          docker run --rm --pull=never --init --user 1000:1000 --network none \
            --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint python \
            ghcr.io/joemccann/radon-python:${{ github.sha }} \
            -c "from playwright.sync_api import sync_playwright; p = sync_playwright().start(); browser = p.chromium.launch(headless=True); page = browser.new_page(); page.set_content('<title>radon-browser-smoke</title>'); assert page.title() == 'radon-browser-smoke'; browser.close(); p.stop()"
      - name: Record python image input hash
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.reuse.outputs.hit != 'true'
        run: |
          set -euo pipefail
          tag="${{ steps.pyimage.outputs.tag }}"
          sha_tag="ghcr.io/joemccann/radon-python:${{ github.sha }}"
          if ! printf '%s\n' "$tag" | grep -Eq '^ghcr.io/joemccann/radon-python:ihash-[0-9a-f]{64}$'; then
            echo "::warning title=python image index::input-hash tag was not recorded; the next identical commit will rebuild"
            exit 0
          fi
          if ! docker buildx imagetools create -t "$tag" "$sha_tag"; then
            echo "::warning title=python image index::input-hash tag was not recorded; the next identical commit will rebuild"
            exit 0
          fi

      - name: Reuse identical model gateway image
        id: reuse-gateway
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set -euo pipefail
          hash="${{ steps.pyimage.outputs.hash }}"
          if ! printf '%s\n' "$hash" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "hit=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          source="ghcr.io/joemccann/radon-model-gateway:ihash-${hash}"
          target="ghcr.io/joemccann/radon-model-gateway:${{ github.sha }}"
          if ! docker buildx imagetools inspect "$source" >/dev/null 2>&1; then
            echo "hit=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          source_raw="$(docker buildx imagetools inspect "$source" --raw | sha256sum | awk 'NR==1 { print $1 }')"
          docker buildx imagetools create -t "$target" -t ghcr.io/joemccann/radon-model-gateway:latest "$source"
          target_raw="$(docker buildx imagetools inspect "$target" --raw | sha256sum | awk 'NR==1 { print $1 }')"
          test -n "$source_raw" && test "$source_raw" = "$target_raw"
          echo "hit=true" >> "$GITHUB_OUTPUT"
      - name: Build and publish model gateway image
        if: steps.reuse-gateway.outputs.hit != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/app/Dockerfile.python
          target: model-gateway
          platforms: linux/amd64
          load: true
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: |
            ghcr.io/joemccann/radon-model-gateway:${{ github.sha }}
            ghcr.io/joemccann/radon-model-gateway:latest
          cache-from: |
            type=registry,ref=ghcr.io/joemccann/radon-model-gateway:buildcache
            type=registry,ref=ghcr.io/joemccann/radon-python:buildcache
            type=gha,scope=radon-model-gateway
            type=gha,scope=radon-python
          cache-to: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && 'type=registry,ref=ghcr.io/joemccann/radon-model-gateway:buildcache,mode=max' || 'type=gha,mode=max,scope=radon-model-gateway' }}
          provenance: false
      - name: Smoke model gateway runtime
        if: steps.reuse-gateway.outputs.hit != 'true'
        run: |
          docker run --rm --pull=never --init --user 1000:1000 --network none \
            --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint python \
            ghcr.io/joemccann/radon-model-gateway:${{ github.sha }} \
            -c "import importlib.metadata; import chronos, torch; from scripts.model_gateway import server; assert importlib.metadata.version('chronos-forecasting') == '2.3.0'; assert torch.__version__ == '2.12.1+cpu'; assert torch.version.cuda is None"
      - name: Record model gateway image input hash
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.reuse-gateway.outputs.hit != 'true'
        run: |
          set -euo pipefail
          hash="${{ steps.pyimage.outputs.hash }}"
          if ! printf '%s\n' "$hash" | grep -Eq '^[0-9a-f]{64}$'; then exit 0; fi
          if ! docker buildx imagetools create \
              -t "ghcr.io/joemccann/radon-model-gateway:ihash-${hash}" \
              "ghcr.io/joemccann/radon-model-gateway:${{ github.sha }}"; then
            echo "::warning title=model gateway image index::the next identical commit will rebuild"
          fi

  node-image:
    name: Build node image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release version is folded from commit history here, not
          # committed by PRs; the image context excludes .git.
          fetch-depth: 0
      - name: Derive release version
        id: release
        run: echo "version=$(python3 scripts/release_version.py)" >> "$GITHUB_OUTPUT"
      - name: Validate public build environment
        env:
          # NEXT_PUBLIC_* are COMPILE-TIME inlined by the Next build, so an
          # unset build arg ships an empty string into the client bundle and
          # radon-app-runtime's --env-file cannot repair it at runtime: no
          # Clerk publishable key and no API base URL for every browser
          # session. The host-plane path gets this right via deploy.sh's
          # write_web_env; the image path did not. R-233.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_RADON_API_URL: ${{ vars.NEXT_PUBLIC_RADON_API_URL }}
          NEXT_PUBLIC_IB_REALTIME_WS_URL: ${{ vars.NEXT_PUBLIC_IB_REALTIME_WS_URL }}
        run: |
          set -euo pipefail
          for name in NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY NEXT_PUBLIC_RADON_API_URL NEXT_PUBLIC_IB_REALTIME_WS_URL; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is empty; the client bundle would ship without it" >&2
              exit 1
            fi
          done
      - name: Prepare build context
        run: cp docker/app/.dockerignore .dockerignore
      # Private 7.7GB runners still ENOSPC while Docker loads the image
      # (#1330). ubuntu-24.04 main runs already have ~86 GiB free; deleting
      # the preinstalled toolchains there costs 69-339s and becomes the
      # deploy authorizer. Unknown or low free space still deletes.
      - name: Free runner disk
        run: |
          df -h /
          avail_kb="$(df -Pk / | awk 'NR==2 { print $4 }')"
          threshold_kb=$((40 * 1024 * 1024))
          if printf '%s' "$avail_kb" | grep -Eq '^[0-9]+$' && [ "$avail_kb" -ge "$threshold_kb" ]; then
            echo "disk already has ${avail_kb} KiB free; skipping toolchain delete"
          else
            echo "free space ${avail_kb:-unknown} KiB is below ${threshold_kb}; deleting preinstalled toolchains"
            sudo rm -rf /usr/local/lib/android || true
            sudo rm -rf /usr/share/dotnet || true
            sudo rm -rf /opt/ghc || true
            sudo rm -rf /usr/local/.ghcup || true
            sudo rm -rf /opt/hostedtoolcache/CodeQL || true
            docker system prune -af || true
          fi
          df -h /
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Select image cache
        id: image-cache
        env:
          IMAGE_REPO: ghcr.io/joemccann/radon-node
          GHA_SCOPE: radon-node
        run: |
          set -euo pipefail
          # Same boundary as the python image: do not hold the exact-SHA
          # publish on a GHA cache upload. buildcache is not a deploy tag.
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$GITHUB_EVENT_NAME" = "push" ]; then
            # Missing buildcache is the steady state until the first export.
            # A failed inspect must not fail the publish; GHA remains readable.
            cache_from="type=gha,scope=${GHA_SCOPE}"
            if docker buildx imagetools inspect "${IMAGE_REPO}:buildcache" >/dev/null 2>&1; then
              cache_from="type=registry,ref=${IMAGE_REPO}:buildcache"$'\n'"type=gha,scope=${GHA_SCOPE}"
            fi
            {
              echo "cache_from<<EOF"
              printf '%s\n' "$cache_from"
              echo "EOF"
              echo "cache_to=type=registry,ref=${IMAGE_REPO}:buildcache,mode=max"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "cache_from<<EOF"
              echo "type=gha,scope=${GHA_SCOPE}"
              echo "EOF"
              echo "cache_to=type=gha,mode=max,scope=${GHA_SCOPE}"
            } >> "$GITHUB_OUTPUT"
          fi
      - name: Build and publish node image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/app/Dockerfile.node
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: |
            ghcr.io/joemccann/radon-node:${{ github.sha }}
            ghcr.io/joemccann/radon-node:latest
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_RADON_API_URL=${{ vars.NEXT_PUBLIC_RADON_API_URL }}
            NEXT_PUBLIC_IB_REALTIME_WS_URL=${{ vars.NEXT_PUBLIC_IB_REALTIME_WS_URL }}
            RADON_RELEASE_SHA=${{ github.sha }}
            RADON_RELEASE_VERSION=${{ steps.release.outputs.version }}
          cache-from: ${{ steps.image-cache.outputs.cache_from }}
          cache-to: ${{ steps.image-cache.outputs.cache_to }}
          provenance: false


  # The same native bytes exported by the gateway image must execute with
  # streaming/tool protocol compatibility on their actual target platform.
  darwin-clients:
    name: Verify Darwin model clients
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Materialize locked native clients
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          cd docker/app/vendor-clis
          npm ci --ignore-scripts --include=optional --os=darwin --cpu=arm64 --no-audit --no-fund
          node install-darwin.cjs --helpers "$GITHUB_WORKSPACE/scripts/model_gateway" --output "$RUNNER_TEMP/radon-darwin"
      - name: Verify native signatures and offline model transport
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/radon-darwin"
          for cli in claude codex grok rg; do
            codesign --verify --strict --all-architectures "$payload/bin/$cli"
          done
          /usr/bin/sandbox-exec -p '(version 1)(allow default)(deny network-outbound)(allow network-outbound (remote ip "localhost:*"))' \
            "$(command -v python3)" scripts/ci/check_model_cli_transport.py \
            --network-isolated --clients-root "$payload" --versions-file "$payload/package.json"
