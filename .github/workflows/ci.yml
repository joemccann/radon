name: CI (test gate + deploy)

# Tests run on every PR and every push to main. The deploy job is GATED on
# both test jobs — `git push origin main` only reaches the VPS if the full
# Vitest + pytest suites are green. Deploy lives in THIS file because GitHub
# Actions `needs:` cannot reference jobs in another workflow file.
on:
  pull_request:
  push:
    branches: [main]

# Least privilege: this workflow only runs tests and deploys over SSH (the SSH
# key is a secret, not the GITHUB_TOKEN). No job needs to write to the repo, so
# default the GITHUB_TOKEN to read-only. Grant write per-job if ever needed.
permissions:
  contents: read

# Cancellation is scoped to test jobs below. Workflow-level cancellation is
# forbidden: on 2026-07-08 it terminated the SSH deploy after production units
# had been stopped, and the successor then mistook Git HEAD equality for a
# completed release. The deploy job has its own non-canceling production lock.

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    concurrency:
      group: ci-secret-scan-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans git history, not just the working tree, so a secret
          # committed-then-reverted is still caught. fetch-depth: 0 pulls the
          # full history; a shallow clone would scan only the tip and miss it.
          fetch-depth: 0
      # Pinned gitleaks binary (not gitleaks/gitleaks-action@v2): the action
      # defaults to scanning only the PUSH/PR commit RANGE and short-circuits
      # to a no-op on some event types, and it nags about an org GITLEAKS_LICENSE.
      # The bare CLI over the full history is deterministic, license-free, and
      # is exactly what was verified locally (gitleaks 8.x: the dummy Clerk
      # publishable key on the `# gitleaks:allow` line is honored; removing that
      # comment makes the scan FAIL with a generic-api-key finding — proving the
      # gate has teeth and the allow is load-bearing, not decorative).
      - name: Install gitleaks
        run: |
          version="8.30.1"
          sha256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          # Pin the binary by checksum so a compromised release asset can't poison
          # the secret-scan step (the gate that guards every deploy).
          echo "${sha256}  gitleaks.tar.gz" | sha256sum --check --status
          tar -xz -C /usr/local/bin -f gitleaks.tar.gz gitleaks
          rm -f gitleaks.tar.gz
          gitleaks version
      # `detect` exits non-zero (code 1) on any finding, which fails the job and
      # therefore blocks deploy (see the deploy `needs:`). --redact keeps the
      # actual secret value out of the public Actions log on a real hit.
      - name: Scan repo history for committed secrets
        run: gitleaks detect --source . --config cloud/.gitleaks.toml --redact --no-banner --verbose

  changes:
    name: Path filter
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      web: ${{ steps.filter.outputs.web }}
      contracts: ${{ steps.filter.outputs.contracts }}
      contract_cloud_tests: ${{ steps.filter.outputs.contract_cloud_tests }}
      contract_script_tests: ${{ steps.filter.outputs.contract_script_tests }}
      contract_root_tests: ${{ steps.filter.outputs.contract_root_tests }}
    concurrency:
      group: ci-changes-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 scripts/ci/path_filter.py

  app-images:
    name: Exact app images
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: ./.github/workflows/app-images.yml
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ci-app-images-${{ github.ref }}
      cancel-in-progress: true

  contract-cloud-tests:
    name: Cross-tree contracts (cloud)
    needs: [changes]
    if: needs.changes.outputs.contract_cloud_tests != ''
    runs-on: ubuntu-latest
    concurrency:
      group: ci-contract-cloud-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@803947b9bd8e9f986429fa0c5a41c367cd732b41 # v7.2.1
        with:
          python-version: "3.13"
          enable-cache: true
          activate-environment: true
          cache-dependency-glob: |
            requirements-dev.txt
            cloud/requirements-test.txt
      - run: uv pip install -r requirements-dev.txt -r cloud/requirements-test.txt
      - run: >-
          python -m pytest ${{ needs.changes.outputs.contract_cloud_tests }}
          -q --durations=25

  contract-script-tests:
    name: Cross-tree contracts (scripts)
    needs: [changes]
    if: needs.changes.outputs.contract_script_tests != ''
    runs-on: ubuntu-latest
    concurrency:
      group: ci-contract-scripts-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@803947b9bd8e9f986429fa0c5a41c367cd732b41 # v7.2.1
        with:
          python-version: "3.13"
          enable-cache: true
          activate-environment: true
          cache-dependency-glob: |
            requirements.txt
            scripts/requirements-api.txt
            requirements-dev.txt
      - run: uv pip install -r requirements.txt -r scripts/requirements-api.txt -r requirements-dev.txt
      - run: >-
          python -m pytest ${{ needs.changes.outputs.contract_script_tests }}
          -q --durations=25

  contract-root-tests:
    name: Cross-tree contracts (root)
    needs: [changes]
    if: needs.changes.outputs.contract_root_tests != ''
    runs-on: ubuntu-latest
    concurrency:
      group: ci-contract-root-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@803947b9bd8e9f986429fa0c5a41c367cd732b41 # v7.2.1
        with:
          python-version: "3.13"
          enable-cache: true
          activate-environment: true
          cache-dependency-glob: requirements-dev.txt
      - run: uv pip install -r requirements-dev.txt
      - run: >-
          python -m pytest ${{ needs.changes.outputs.contract_root_tests }}
          -q --durations=25

  web-tests:
    name: Vitest (shard ${{ matrix.shard }}/8)
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    concurrency:
      group: ci-web-tests-${{ github.ref }}-${{ matrix.shard }}
      cancel-in-progress: true
    env:
      NODE_ENV: test
      ASSISTANT_MOCK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'web/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      # The repo has TWO bun projects: the root one provides vitest + the
      # cross-cutting vitest.config.ts (which imports `vitest/config`), and
      # web/ provides the app modules the tests import (@/lib, react, ...).
      # Install BOTH or the root config fails to load with ERR_MODULE_NOT_FOUND.
      - run: |
          bun install --frozen-lockfile &
          bun install --frozen-lockfile --cwd web &
          wait
      # Run the FULL vitest config from the repo root (lib/tools + site/lib +
      # web/tests), NOT `bun run test` — that script restricts to web/tests and
      # silently skips ~9 files / ~68 tests (incl. site/lib/theme). vitest + the
      # config resolve from root node_modules; web/tests files resolve their
      # imports from web/node_modules.
      #
      # NOTE: there are NO --exclude flags here any more (T-276). Three files
      # used to be excluded wholesale for spawning `python3.13`, which the
      # Bun-only job does not have. But those files are MIXED: only 9 of their
      # 27 tests spawn anything. The other 18 — PI command dispatch, the
      # /api/prices deprecation contract, and the 2026-05-22 bare-`python3.13`
      # outage regression in resolvePythonBin — need no subprocess and now run
      # in this gate. The 9 that do skip BY NAME via `hasPython313()`
      # (web/tests/helpers/python313.ts), so the reason is visible in the run
      # output instead of buried in this file.
      # scripts/tests/test_vitest_python_gating.py fails if an --exclude for
      # any of those three paths comes back.
      # NOTE: data-reader.test.ts is NO LONGER excluded — it was failing only
      # from a non-root cwd (fixtures written cwd-relative while readDataFile
      # reads from resolveProjectRoot()); the test now writes under the project
      # root, so it is cwd-independent and runs in CI.
      #
      # Shards zero the per-job coverage thresholds: each shard only executes
      # an eighth of the tests, so the ratchet would false-fail. web-coverage merges
      # istanbul JSON and applies vitest.config.ts lines/functions/branches.
      - run: >-
          bunx vitest run --config vitest.config.ts --coverage
          --shard=${{ matrix.shard }}/8
          --coverage.reporter=json
          --coverage.reportsDirectory=coverage/shard-${{ matrix.shard }}
          --coverage.thresholds.lines=0
          --coverage.thresholds.functions=0
          --coverage.thresholds.branches=0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-coverage-${{ matrix.shard }}
          path: coverage/shard-${{ matrix.shard }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  web-coverage:
    name: Vitest coverage ratchet
    needs: [web-tests]
    if: needs.web-tests.result == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: ci-web-coverage-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts/ci/merge_vitest_coverage.py
            vitest.config.ts
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: vitest-coverage-*
          path: coverage-artifacts
      # --expect-shards must match the web-tests shard count above. The merge
      # downloads with a glob, so without it a partial artifact download was
      # gated as if it were the whole suite. R-241.
      - run: python3 scripts/ci/merge_vitest_coverage.py --root coverage-artifacts --expect-shards 8

  py-tests:
    name: pytest (${{ matrix.shard }})
    needs: [changes]
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Isolate test_i* and scripts/api/tests. Split g-h / j-m because the
        # combined ghjm bucket was the pytest wall (~82s).
        # scripts-daemons: the test_*.py globs match FILES only, so the
        # monitor_daemon/ and watchdog/ subdirectories need their own shard
        # (TEST_AUDIT T-122 — 752 tests left CI unnoticed without it).
        # test_ci_deploy_concurrency.py asserts shard-union == recursive.
        shard: [scripts-ac, scripts-df, scripts-i, scripts-gh, scripts-jm, scripts-npsz, scripts-rs, scripts-daemons, rest-api, rest]
        include:
          - shard: scripts-ac
            paths: "scripts/tests/test_[a-c]*.py"
          - shard: scripts-df
            paths: "scripts/tests/test_[d-f]*.py"
          - shard: scripts-i
            paths: "scripts/tests/test_i*.py"
          - shard: scripts-gh
            paths: "scripts/tests/test_[g-h]*.py"
          - shard: scripts-jm
            paths: "scripts/tests/test_[j-m]*.py"
          - shard: scripts-npsz
            paths: "scripts/tests/test_[n-p]*.py scripts/tests/test_[t-z]*.py"
          - shard: scripts-rs
            paths: "scripts/tests/test_[r-s]*.py"
          - shard: scripts-daemons
            paths: "scripts/tests/test_monitor_daemon scripts/tests/test_watchdog"
          - shard: rest-api
            paths: scripts/api/tests
          - shard: rest
            paths: scripts/trade_blotter tests
    concurrency:
      group: ci-py-tests-${{ github.ref }}-${{ matrix.shard }}
      cancel-in-progress: true
    env:
      DOCS_CONTRACT_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # docs contract (test_docs_contract.py) diffs against DOCS_CONTRACT_BASE.
          fetch-depth: ${{ matrix.shard == 'scripts-df' && 0 || 1 }}
      - uses: astral-sh/setup-uv@803947b9bd8e9f986429fa0c5a41c367cd732b41 # v7.2.1
        with:
          python-version: "3.13"
          enable-cache: true
          # ubuntu-latest has no system 3.13. --system fails with
          # "No system Python installation found for Python 3.13".
          activate-environment: true
          cache-dependency-glob: |
            requirements.txt
            scripts/requirements-api.txt
            requirements-dev.txt
            cloud/requirements-test.txt
      - name: Install dependencies
        run: |
          uv pip install -r requirements.txt -r scripts/requirements-api.txt -r requirements-dev.txt
      # Run from the repo ROOT — pyproject.toml pins pythonpath so `import
      # ib_sync` / `from api.*` / trade_blotter all resolve. addopts already
      # applies `-m 'not integration'`, so the live MenthorQ suite is skipped.
      # scripts/trade_blotter is listed explicitly: without it the blotter
      # tests (29 collected) are orphaned — pythonpath includes the dir, but it
      # is not a collection target unless named.
      #
      # Shards zero --cov-fail-under: each machine only executes part of the
      # suite. py-coverage combines the data files and applies the 56 ratchet.
      # `tests` (repo root) carries the TWR money-math suite (TEST_AUDIT T-051).
      #
      # -n auto --dist loadfile: GitHub-hosted runners have multiple cores;
      # loadfile keeps each test module on one worker so autouse fixtures and
      # module-level stubs do not race. pytest-cov combines worker coverage.
      - run: >-
          python -m pytest ${{ matrix.paths }}
          -n auto --dist loadfile
          --durations=25
          --cov=scripts --cov=api
          --cov-fail-under=0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-coverage-${{ matrix.shard }}
          path: .coverage
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  py-coverage:
    name: pytest coverage ratchet
    needs: [py-tests]
    if: needs.py-tests.result == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: ci-py-coverage-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            pyproject.toml
            scripts
            tests
      - uses: astral-sh/setup-uv@803947b9bd8e9f986429fa0c5a41c367cd732b41 # v7.2.1
        with:
          python-version: "3.13"
          enable-cache: true
          activate-environment: true
      - name: Install dependencies
        run: uv pip install pytest-cov==7.1.0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: pytest-coverage-*
          path: coverage-artifacts
      # --cov-fail-under is a non-regressing RATCHET, not a vanity target.
      # 2026-08-08 (TEST_AUDIT T-050): honest product-only coverage; 56 sits
      # ~2.5pts below the measured figure. Never lower it to make a red build
      # pass.
      - run: |
          mapfile -d '' files < <(find coverage-artifacts -name '.coverage' -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no .coverage files under coverage-artifacts" >&2
            find coverage-artifacts -print >&2
            exit 1
          fi
          python -m coverage combine "${files[@]}"
          python -m coverage report --fail-under=56 --show-missing
      # REL-065 / R-156: docs/demo-environment.md has claimed since phase 0
      # that a "CI isolation guard rejects any demo deploy whose env carries a
      # prod TURSO_DB_URL". Nothing invoked it. On demo.radon.run
      # ALLOWED_USER_IDS is absent by design and the account routes carry no
      # operatorOnly, so DB isolation is the ONLY layer between a trial user
      # and the operator's real positions, TWR curve, NAV and blotter.
      # Skipped when no demo env is configured on the runner, so this cannot
      # fail a prod-only CI run.
      - name: Demo isolation guard
        env:
          TURSO_DEMO_DB_URL: ${{ secrets.TURSO_DEMO_DB_URL }}
          TURSO_DB_URL: ${{ secrets.TURSO_DEMO_APP_DB_URL }}
          RADON_API_TEST_MODE: "1"
        run: |
          if [ -z "${TURSO_DEMO_DB_URL}" ] && [ -z "${TURSO_DB_URL}" ]; then
            # TEST_AUDIT T-130: neither TURSO_DEMO_DB_URL nor
            # TURSO_DEMO_APP_DB_URL is provisioned as a repo/environment
            # secret, so this guard has never executed. Annotate the run so
            # the skip is visible on every workflow, not buried in a log.
            echo "::warning title=Demo isolation guard SKIPPED::TURSO_DEMO_DB_URL / TURSO_DEMO_APP_DB_URL secrets are not provisioned; scripts/ci/check_demo_isolation.py did not run"
            exit 0
          fi
          python3 scripts/ci/check_demo_isolation.py

  cloud-tests:
    name: pytest (cloud ${{ matrix.shard }})
    needs: [changes]
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [al, edge, mz]
        include:
          - shard: al
            paths: "cloud/tests/test_[a-l]*.py --ignore=cloud/tests/test_caddy_edge_timeouts.py"
          - shard: edge
            paths: "cloud/tests/test_caddy_edge_timeouts.py"
          - shard: mz
            paths: "cloud/tests/test_[m-z]*.py"
    concurrency:
      group: ci-cloud-tests-${{ github.ref }}-${{ matrix.shard }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@803947b9bd8e9f986429fa0c5a41c367cd732b41 # v7.2.1
        with:
          python-version: "3.13"
          enable-cache: true
          activate-environment: true
          cache-dependency-glob: |
            requirements-dev.txt
            cloud/requirements-test.txt
      - name: Install dependencies
        run: |
          uv pip install -r requirements-dev.txt
          if [ -f cloud/requirements-test.txt ]; then
            uv pip install -r cloud/requirements-test.txt
          fi
      # cloud/tests/test_caddy_edge_timeouts.py::TestEdgeMechanism is the only
      # EXECUTABLE proof of the R-219 bound on a hung upstream and the R-220
      # non-replay of a severed POST /api/orders/place. R-220 is an
      # order-duplication guard on a path with no idempotency key. Without a
      # caddy binary both skip, and a Caddy release that changes retry_match
      # semantics ships green. Deliberately tracks stable rather than pinning:
      # detecting that semantics change is the point. T-205 (T-164 recurrence).
      - name: Install caddy (edge mechanism tests)
        if: matrix.shard == 'edge'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh api repos/caddyserver/caddy/releases/latest --jq .tag_name)"
          curl -fsSL \
            "https://github.com/caddyserver/caddy/releases/download/${tag}/caddy_${tag#v}_linux_amd64.tar.gz" \
            -o /tmp/caddy.tar.gz
          tar -xzf /tmp/caddy.tar.gz -C /tmp caddy
          sudo install -m 0755 /tmp/caddy /usr/local/bin/caddy
          caddy version
      # Separate job: pyproject.toml norecursedirs includes cloud/ because
      # cloud/tests/conftest.py collides with scripts/tests/conftest.py on the
      # import path `tests.conftest`. Running it after unit pytest serialized
      # ~60s onto the deploy critical path.
      - run: python -m pytest ${{ matrix.paths }} -q --durations=25

  perimeter-smoke:
    name: Perimeter smoke (next start + curl)
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: ci-perimeter-smoke-${{ github.ref }}
      cancel-in-progress: true
    # First job in CI that runs `next build`; compile mode keeps it to a few
    # minutes but budget for cold runner caches.
    timeout-minutes: 12
    env:
      # Dummy-format Clerk keys: the publishable key must decode to a
      # frontend-API domain ending in `$` (here base64("clerk.example.com$")).
      # No Clerk network calls happen — an anonymous curl carries no session
      # cookie, so the middleware 401s before any key verification.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k # gitleaks:allow
      CLERK_SECRET_KEY: sk_test_radon_ci_perimeter_smoke_dummy
      # Dummy bearer token for the DUR-16 probe-gate asserts below. The
      # authorized curl is the only request-time proof that the timing-safe
      # Web Crypto compare runs in the real Edge middleware runtime.
      RADON_PROBE_FRESHNESS_TOKEN: rpf_ci_perimeter_smoke_dummy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'web/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      # Both bun projects, same as web-tests: next.config aliases @tools to
      # the root lib/tools, so the build resolves modules from BOTH trees.
      - run: |
          bun install --frozen-lockfile &
          bun install --frozen-lockfile --cwd web &
          wait
      # Static half of the Edge-runtime guard: the no-restricted-syntax
      # node:* ban on the middleware import graph (web/eslint.config.mjs).
      # Scoped to the perimeter files so unrelated lint warnings can't block
      # the gate; `next start` + curl below is the dynamic half.
      - run: bunx eslint middleware.ts lib/apiContracts.ts lib/probeAuth.ts
        working-directory: web
      # Locked build constraint: web/package.json `build` is
      # `next build --experimental-build-mode=compile` (see web/CLAUDE.md).
      - run: bun run build
        working-directory: web
      # Request-time perimeter assertions against the real production server.
      # This is the only gate that catches the Edge-runtime crash class
      # (node:* import in the middleware graph — tsc/vitest/build all pass;
      # production 500s on EVERY route at request time, 2026-05-15) and
      # default-deny regressions (world-callable /api/*, 60fcca8 era).
      - name: next start + perimeter curls
        working-directory: web
        run: |
          bunx next start -p 3000 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:3000/sign-in && break
            sleep 1
          done

          fail=0
          assert_status() {
            path="$1"; want="$2"; auth="${3:-}"
            if [ -n "$auth" ]; then
              got=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: ${auth}" "http://127.0.0.1:3000${path}")
            else
              got=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:3000${path}")
            fi
            if [ "$got" = "$want" ]; then
              echo "PASS ${path} -> ${got}"
            else
              echo "FAIL ${path} -> ${got} (expected ${want})"
              fail=1
            fi
          }

          # Public route boots and renders (a middleware crash = 500 here).
          assert_status /sign-in 200
          # Middleware-gated API is denied anonymously — exactly 401, not
          # merely non-500.
          assert_status /api/portfolio 401
          # Unknown share scope stays default-deny (the /share allowlist is
          # explicit; see web/tests/middleware-share-allowlist.test.ts).
          assert_status /api/journal/share 401
          # DUR-16 probe gate: anonymous + wrong-token denied; the correct
          # bearer passes the timing-safe Web Crypto compare in the REAL
          # Edge middleware runtime and reaches the route (which 200s even
          # without Turso creds — quiet/unproven checks are data, not 5xx).
          assert_status /api/probe/freshness 401
          assert_status /api/probe/freshness 401 "Bearer wrong-token"
          assert_status /api/probe/freshness 200 "Bearer ${RADON_PROBE_FRESHNESS_TOKEN}"
          exit $fail

  e2e-financial-smoke:
    name: Playwright P0-financial smoke (non-gating)
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    # The earlier "chromium can't reach loopback" reading (2026-06-13) was a
    # misdiagnosis: the navigation actually failed because a Clerk DEVELOPMENT
    # instance (pk_test_) answered every cookie-less browser navigation with a
    # dev-browser handshake 307 to an unresolvable dummy Clerk host, surfacing as
    # ERR_NAME_NOT_RESOLVED. Fixed in web/middleware.ts by running the authless
    # bypass OUTSIDE clerkMiddleware (bypassed requests never trigger the
    # handshake) and by reading the client host from the Host header (nextUrl is
    # the 0.0.0.0 bind address under `next start -H 0.0.0.0`). The browser now
    # navigates the loopback 127.0.0.1 directly (PLAYWRIGHT_BASE_HOST below).
    # `next dev` still never readies in the constrained container (cold-compiling
    # heavy routes hangs), so the job builds once and serves a prebuilt
    # `next start` (the perimeter-smoke pattern). day-move-ib-daily-pnl is held
    # out (dev-vs-prod Day Move divergence, TEST_AUDIT NEW_FINDINGS); still runs
    # locally.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-jammy
    concurrency:
      group: ci-e2e-smoke-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 25
    env:
      CI: "1"
      RADON_AUTHLESS_TEST: "1"
      NEXT_PUBLIC_RADON_AUTHLESS_TEST: "1"
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k # gitleaks:allow
      CLERK_SECRET_KEY: sk_test_radon_ci_e2e_smoke_dummy # gitleaks:allow
      PLAYWRIGHT_PORT: "3000"
      # Serve on all interfaces, navigate the loopback IP literal (no DNS — the
      # container's chromium resolves the "localhost" NAME flakily; the literal
      # never needs resolution and is in the middleware's LOCAL_HOSTS set).
      PLAYWRIGHT_BASE_HOST: "127.0.0.1"
      PLAYWRIGHT_WEBSERVER_CMD: "npx next start -H 0.0.0.0 -p 3000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The Playwright image ships without unzip, which setup-bun needs to
      # extract its release archive (first-run failure 2026-08-08).
      - run: apt-get update -qq && apt-get install -y -qq unzip
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: web
      # Prebuild so `next start` serves compiled routes (locked compile mode;
      # see web/CLAUDE.md). playwright.config.ts's webServer runs next start.
      - run: bun run build
        working-directory: web
      # Curated P0-financial subset (page.route-mocked end-to-end, web-first
      # assertions, no live IB/network/DB). The full 123-file suite stays local
      # until it earns its way in. NOT in deploy.needs yet — per the
      # long-standing rule, promote only after GREEN runs are observed here.
      - name: Run curated P0-financial specs
        working-directory: web
        run: >-
          npx playwright test
          e2e/account-metric-cards.spec.ts
          e2e/order-combo.spec.ts
          e2e/realized-pnl.spec.ts
          e2e/share-pnl.spec.ts
          e2e/wulf-close-order-naked-short.spec.ts
          e2e/portfolio-same-day-combo-pnl.spec.ts
          e2e/portfolio-same-day-equity-pnl.spec.ts
          e2e/stop-order-desktop.spec.ts
          e2e/modify-order-correlation-risk.spec.ts
          e2e/chain-expiry-preserves-builder.spec.ts
          e2e/act-ticket-scroll.spec.ts
          e2e/orders-realized-pnl-portfolio-fallback.spec.ts
          e2e/orders-partial-realized-pnl.spec.ts
          e2e/share-pnl-entry-exit.spec.ts
          e2e/chain-deck-ticket-scroll.spec.ts
          e2e/leap-order-prefill.spec.ts
          e2e/mobile-orders-session.spec.ts
          e2e/orders-session-window.spec.ts
          e2e/vixts-tab.spec.ts
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: web/test-results/
          retention-days: 7

  stage-release:
    name: Prestage VPS release
    # This job SSHes into the live trading host and runs the pushed commit's
    # own deploy.sh there, so it must wait on exactly the gate `deploy` waits
    # on. Without it, untested code executed on production before a single
    # test ran, and `continue-on-error` hid the fact. R-201.
    #
    # Keep this list identical to the prepull job and to `deploy.needs` minus
    # the two host-preparation jobs (`stage-release` and `prepull-images`).
    # `test_ci_gate_integrity.py` derives the gate FROM `deploy.needs` and will
    # fail if the two drift again — which is how web-coverage and py-coverage
    # were found missing here. R-299. It also asserts every gate job appears in
    # the `if:` BELOW: `!cancelled()` is a status function, so GitHub drops the
    # implicit success() on `needs` and only the expression gates. R-324.
    needs: [secret-scan, changes, app-images, contract-cloud-tests, contract-script-tests, contract-root-tests, web-tests, web-coverage, py-tests, py-coverage, cloud-tests, perimeter-smoke]
    if: >-
      github.ref == 'refs/heads/main' && github.event_name == 'push' && !cancelled()
      && needs.secret-scan.result == 'success'
      && needs.changes.result == 'success'
      && needs.app-images.result == 'success'
      && (needs.contract-cloud-tests.result == 'success' || needs.contract-cloud-tests.result == 'skipped')
      && (needs.contract-script-tests.result == 'success' || needs.contract-script-tests.result == 'skipped')
      && (needs.contract-root-tests.result == 'success' || needs.contract-root-tests.result == 'skipped')
      && (needs.web-tests.result == 'success' || needs.web-tests.result == 'skipped')
      && (needs.web-coverage.result == 'success' || needs.web-coverage.result == 'skipped')
      && (needs.py-tests.result == 'success' || needs.py-tests.result == 'skipped')
      && (needs.py-coverage.result == 'success' || needs.py-coverage.result == 'skipped')
      && (needs.cloud-tests.result == 'success' || needs.cloud-tests.result == 'skipped')
      && (needs.perimeter-smoke.result == 'success' || needs.perimeter-smoke.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ci-stage-release-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Prestage via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: radon
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            SHA='${{ github.sha }}'
            RUN_ID='${{ github.run_id }}.${{ github.run_attempt }}'
            RADON="${HOME}/radon"
            LEGACY_CLOUD="${HOME}/radon-cloud"
            if [[ -f /etc/radon/env && ! -L /etc/radon/env ]]; then
              ENV_FILE=/etc/radon/env
            else
              ENV_FILE="${LEGACY_CLOUD}/.env"
            fi
            RUNNER_ROOT="${HOME}/.radon-deploy-runners"
            RUNNER="${RUNNER_ROOT}/${SHA}.${RUN_ID}.prestage"
            RUNNER_INDEX_LOCK="${RUNNER_ROOT}/.index.lock"
            RADON_CONTROL_PLANE_READY="${RADON_CONTROL_PLANE_READY:-/var/lib/radon/control-plane-ready}"
            if [[ ! -f "$RADON_CONTROL_PLANE_READY" || -L "$RADON_CONTROL_PLANE_READY" ]]; then
              echo "control plane not ready; skipping prestage"
              exit 0
            fi
            git -C "$RADON" fetch --prune origin main
            if ! git -C "$RADON" cat-file -e "${SHA}:cloud/scripts/deploy.sh" 2>/dev/null; then
              echo "release has no monorepo deploy.sh; skipping prestage"
              exit 0
            fi
            umask 077
            mkdir -p "$RUNNER_ROOT"
            exec {RUNNER_INDEX_FD}>"$RUNNER_INDEX_LOCK"
            flock "$RUNNER_INDEX_FD"
            if [[ ! -d "$RUNNER" ]]; then
              RUNNER_TMP="$(mktemp -d "${RUNNER_ROOT}/.runner.XXXXXX")"
              trap 'rm -rf -- "$RUNNER_TMP"' EXIT
              git -C "$RADON" archive "$SHA" cloud | tar -x -C "$RUNNER_TMP"
              printf '%s\n' "$SHA" > "$RUNNER_TMP/.target-sha"
              chmod -R a-w "$RUNNER_TMP/cloud" "$RUNNER_TMP/.target-sha"
              mv "$RUNNER_TMP" "$RUNNER"
              trap - EXIT
            fi
            exec {RUNNER_ACTIVE_FD}>"$RUNNER/.active.lock"
            flock "$RUNNER_ACTIVE_FD"
            exec {RUNNER_INDEX_FD}>&-
            [[ "$(cat "$RUNNER/.target-sha")" == "$SHA" ]]
            [[ -x "$RUNNER/cloud/scripts/deploy.sh" ]]
            export RADON_DIR="$RADON"
            export RADON_CLOUD_DIR="$RUNNER/cloud"
            export RADON_DEPLOY_SUPPORT_DIR="$RUNNER/cloud/scripts"
            export RADON_DEPLOY_ENV_FILE="$ENV_FILE"
            export RADON_CONTROL_PLANE_READY
            export RADON_DEPLOY_STAGE=1
            # app-images is a hard need of this job. deploy.sh still proves
            # the exact local pair and loaded container drop-in before it can
            # omit the duplicate host-side Next compile.
            export RADON_DEPLOY_USE_NODE_IMAGE_BUILD=1
            bash "$RUNNER/cloud/scripts/deploy.sh" "$SHA"

  prepull-images:
    name: Prepull exact app images
    # Safe to overlap prestage: every code/test gate and the exact image build
    # are green before this fixed installed helper touches the host. The job is
    # cancelable because it never stops or restarts a service.
    needs: [secret-scan, changes, app-images, contract-cloud-tests, contract-script-tests, contract-root-tests, web-tests, web-coverage, py-tests, py-coverage, cloud-tests, perimeter-smoke]
    if: >-
      github.ref == 'refs/heads/main' && github.event_name == 'push' && !cancelled()
      && needs.secret-scan.result == 'success'
      && needs.changes.result == 'success'
      && needs.app-images.result == 'success'
      && (needs.contract-cloud-tests.result == 'success' || needs.contract-cloud-tests.result == 'skipped')
      && (needs.contract-script-tests.result == 'success' || needs.contract-script-tests.result == 'skipped')
      && (needs.contract-root-tests.result == 'success' || needs.contract-root-tests.result == 'skipped')
      && (needs.web-tests.result == 'success' || needs.web-tests.result == 'skipped')
      && (needs.web-coverage.result == 'success' || needs.web-coverage.result == 'skipped')
      && (needs.py-tests.result == 'success' || needs.py-tests.result == 'skipped')
      && (needs.py-coverage.result == 'success' || needs.py-coverage.result == 'skipped')
      && (needs.cloud-tests.result == 'success' || needs.cloud-tests.result == 'skipped')
      && (needs.perimeter-smoke.result == 'success' || needs.perimeter-smoke.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ci-prepull-images-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Pull exact SHA pair via installed helper
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: radon
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 12m
          script: |
            set -euo pipefail
            SHA='${{ github.sha }}'
            sudo -n /usr/local/sbin/radon-app-runtime pull "$SHA"

  deploy:
    name: Deploy to VPS
    # TEST_AUDIT T-160: the coverage-combine jobs are back on `needs`. They were
    # dropped so deploy could start the moment the shards went green, deferring
    # enforcement to a "required workflow job" — but `main` carries no
    # `required_status_checks` at all, so nothing enforced them and both
    # ratchets (vitest lines/functions/branches, pytest --cov-fail-under=56)
    # were advisory. Combine genuinely needs its own barrier VM, so this costs
    # the deploy critical path ~1min. Gating and that latency cannot both be
    # had; a coverage regression must be able to fail the release.
    needs: [secret-scan, changes, app-images, contract-cloud-tests, contract-script-tests, contract-root-tests, web-tests, web-coverage, py-tests, py-coverage, cloud-tests, perimeter-smoke, stage-release, prepull-images]
    if: >-
      github.ref == 'refs/heads/main' && github.event_name == 'push' && !cancelled()
      && needs.secret-scan.result == 'success'
      && needs.changes.result == 'success'
      && needs.app-images.result == 'success'
      && (needs.contract-cloud-tests.result == 'success' || needs.contract-cloud-tests.result == 'skipped')
      && (needs.contract-script-tests.result == 'success' || needs.contract-script-tests.result == 'skipped')
      && (needs.contract-root-tests.result == 'success' || needs.contract-root-tests.result == 'skipped')
      && (needs.web-tests.result == 'success' || needs.web-tests.result == 'skipped')
      && (needs.web-coverage.result == 'success' || needs.web-coverage.result == 'skipped')
      && (needs.py-tests.result == 'success' || needs.py-tests.result == 'skipped')
      && (needs.py-coverage.result == 'success' || needs.py-coverage.result == 'skipped')
      && (needs.cloud-tests.result == 'success' || needs.cloud-tests.result == 'skipped')
      && (needs.perimeter-smoke.result == 'success' || needs.perimeter-smoke.result == 'skipped')
      && (needs.stage-release.result == 'success' || needs.stage-release.result == 'failure' || needs.stage-release.result == 'skipped')
      && (needs.prepull-images.result == 'success' || needs.prepull-images.result == 'failure')
    runs-on: ubuntu-latest
    # Outer budget: deploy.sh gets 15m, then 30s to kill descendants. A root
    # action can hold its lifecycle lock for 180s. Worst-case durable recovery
    # can serialize four such helper actions after waiting 190s. SSH gets 36m
    # and the job gets 40m so recovery remains inside the caller budget.
    timeout-minutes: 60
    # Once SSH starts it must finish. Newer green deploys queue behind the
    # running release; they never cancel it while production is between states.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    # Keep the deploy bound to the GitHub Environment for deployment history,
    # URL metadata, environment-scoped configuration, and its main-only branch
    # policy. The Environment intentionally has no required-reviewer rule: once
    # every `needs:` job is green, a push to main deploys without manual approval.
    # GitHub environment protection is mutable control-plane state, so verify it
    # with `gh api repos/:owner/:repo/environments/Production` when auditing.
    environment:
      name: production
      url: https://app.radon.run
    steps:
      - name: Deploy via SSH
        # Pinned to the v1.2.5 commit SHA (was the mutable `@v1` tag). This step
        # receives the VPS SSH key + deploy secrets, so a hijacked tag would be a
        # supply-chain RCE on the production host. Bump deliberately.
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: radon
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 55m
          script: |
            set -euo pipefail
            SHA='${{ github.sha }}'
            RUN_ID='${{ github.run_id }}.${{ github.run_attempt }}'
            RADON="${HOME}/radon"
            LEGACY_CLOUD="${HOME}/radon-cloud"
            if [[ -f /etc/radon/env && ! -L /etc/radon/env ]]; then
              ENV_FILE=/etc/radon/env
            else
              ENV_FILE="${LEGACY_CLOUD}/.env"
            fi
            RUNNER_ROOT="${HOME}/.radon-deploy-runners"
            RUNNER="${RUNNER_ROOT}/${SHA}.${RUN_ID}"
            RUNNER_KEEP_NEWEST=4
            RUNNER_INDEX_LOCK="${RUNNER_ROOT}/.index.lock"
            RADON_CONTROL_PLANE_READY="${RADON_CONTROL_PLANE_READY:-/var/lib/radon/control-plane-ready}"
            git -C "$RADON" fetch --prune origin main

            verify_health_status_schema() {
              local attempt body
              for attempt in $(seq 1 15); do
                body="$(curl -fsS --max-time 5 http://127.0.0.1:8330/status 2>/dev/null || true)"
                if printf '%s' "$body" | /usr/bin/python3.13 -c '
            import json, sys
            try:
                payload = json.load(sys.stdin)
            except Exception:
                raise SystemExit(1)
            healthy_contract = (
                isinstance(payload.get("ok"), bool)
                and isinstance(payload.get("overall_state"), str)
            )
            raise SystemExit(0 if healthy_contract else 1)
            '; then
                  echo "health status schema is current (broker state is advisory)"
                  return 0
                fi
                sleep 2
              done
              echo "radon-health did not publish the required status schema" >&2
              return 1
            }

            deploy_with_legacy_runner() {
              bash "$LEGACY_CLOUD/scripts/deploy.sh" "$SHA"
              # The legacy runner restarts only five app units. Restart the
              # isolated schema producer explicitly so a new scheduled probe
              # consumer can never outrun it again. This checks schema only;
              # IB/broker health may legitimately be degraded.
              if [[ -r "$RADON_CONTROL_PLANE_READY" ]]; then
                sudo -n /usr/local/bin/radon unit restart radon-health.service
              else
                sudo -n /usr/bin/systemctl restart radon-health.service
              fi
              verify_health_status_schema
            }

            # Until a root operator installs the target control-plane bundle,
            # keep the already-proven legacy runner.
            if [[ ! -e "$RADON_CONTROL_PLANE_READY" && ! -L "$RADON_CONTROL_PLANE_READY" ]]; then
              deploy_with_legacy_runner
              exit 0
            fi
            if [[ ! -f "$RADON_CONTROL_PLANE_READY" \
              || -L "$RADON_CONTROL_PLANE_READY" \
              || ! -r "$RADON_CONTROL_PLANE_READY" ]]; then
              echo "refusing an invalid control-plane readiness marker" >&2
              exit 78
            fi
            if ! git -C "$RADON" cat-file -e "${SHA}:cloud/scripts/deploy.sh" 2>/dev/null; then
              echo "refusing a new pre-cloud release after control-plane cutover" >&2
              exit 78
            fi

            # Extract support code from the tested SHA into a retained runner.
            # Never rewrite live cloud/ before deploy.sh owns its production lock;
            # recovery can keep using this bundle even after Git rolls live code
            # back to a commit that predates the monorepo import.
            umask 077
            mkdir -p "$RUNNER_ROOT"
            exec {RUNNER_INDEX_FD}>"$RUNNER_INDEX_LOCK"
            flock "$RUNNER_INDEX_FD"
            if [[ ! -d "$RUNNER" ]]; then
              RUNNER_TMP="$(mktemp -d "${RUNNER_ROOT}/.runner.XXXXXX")"
              trap 'rm -rf -- "$RUNNER_TMP"' EXIT
              git -C "$RADON" archive "$SHA" cloud | tar -x -C "$RUNNER_TMP"
              printf '%s\n' "$SHA" > "$RUNNER_TMP/.target-sha"
              chmod -R a-w "$RUNNER_TMP/cloud" "$RUNNER_TMP/.target-sha"
              mv "$RUNNER_TMP" "$RUNNER"
              trap - EXIT
            fi
            # Hold this through deploy and pruning. The pruner takes the same
            # lock non-blocking before removing any older runner.
            exec {RUNNER_ACTIVE_FD}>"$RUNNER/.active.lock"
            flock "$RUNNER_ACTIVE_FD"
            exec {RUNNER_INDEX_FD}>&-
            [[ "$(cat "$RUNNER/.target-sha")" == "$SHA" ]]
            [[ -x "$RUNNER/cloud/scripts/deploy.sh" ]]
            [[ -x "$RUNNER/cloud/scripts/prune-deploy-runners.py" ]]

            export RADON_DIR="$RADON"
            export RADON_CLOUD_DIR="$RUNNER/cloud"
            export RADON_DEPLOY_SUPPORT_DIR="$RUNNER/cloud/scripts"
            export RADON_DEPLOY_ENV_FILE="$ENV_FILE"
            export RADON_CONTROL_PLANE_READY
            # Reconcile the root-owned control plane with this tip BEFORE
            # deploy.sh holds the deploy lock (bootstrap needs that lock).
            # Runs only here, after every gate job is green. R-430.
            # A transition journal left by a failed deploy makes bootstrap
            # refuse, so recover it first (deploy.sh does exactly this pass
            # at its own start; here it runs before the sync instead).
            if grep -q 'RADON_DEPLOY_RECOVER_ONLY' "$RUNNER/cloud/scripts/deploy.sh"; then
              RADON_DEPLOY_RECOVER_ONLY=1 bash "$RUNNER/cloud/scripts/deploy.sh" "$SHA"
            fi
            if [[ -f "$RUNNER/cloud/scripts/sync-control-plane.sh" ]]; then
              bash "$RUNNER/cloud/scripts/sync-control-plane.sh"
            fi
            bash "$RUNNER/cloud/scripts/deploy.sh" "$SHA"
            "$RUNNER/cloud/scripts/prune-deploy-runners.py" \
              --root "$RUNNER_ROOT" \
              --current "$RUNNER" \
              --keep-newest "$RUNNER_KEEP_NEWEST"
