name: TesterArmy user flows

on:
  pull_request:
    paths:
      - 'web/**'
      - 'site/**'
      - 'scripts/api/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/tester-army.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'site/**'
      - 'scripts/api/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/tester-army.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tester-army-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flows:
    name: TesterArmy ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [web, site]
    env:
      CI: '1'
      E2E_TELEMETRY_DISABLED: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_DIST_DIR: .next-tester-army
      TESTER_ARMY_SERVER_MODE: start
      RADON_AUTHLESS_TEST: '1'
      RADON_API_URL: http://127.0.0.1:1
      TURSO_DB_URL: ''
      TURSO_AUTH_TOKEN: ''
      TURSO_DEMO_DB_URL: ''
      TURSO_DEMO_AUTH_TOKEN: ''
      NEXT_PUBLIC_RADON_AUTHLESS_TEST: '1'
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_cmFkb24tZTJlLXN0dWIuY2xlcmsuYWNjb3VudHMuZGV2JA # gitleaks:allow
      CLERK_SECRET_KEY: sk_test_radon_ci_e2e_smoke_dummy # gitleaks:allow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - name: Install application dependencies
        run: |
          bun install --frozen-lockfile
          bun install --frozen-lockfile --cwd web
          npm ci --prefix site
      - name: Install isolated TesterArmy SDK
        working-directory: ${{ matrix.project }}/tester-army
        run: npm ci
      - name: Install matching browser
        working-directory: ${{ matrix.project }}/tester-army
        run: npx playwright install chromium --with-deps
      - name: Verify workstation output-trace audit
        if: matrix.project == 'web'
        working-directory: web
        run: node --test scripts/audit-output-traces.test.mjs
      - name: Build app for browser tests
        working-directory: ${{ matrix.project }}
        run: npm run build
      - name: Verify user flows
        working-directory: ${{ matrix.project }}/tester-army
        run: npm test -- --reporter list,junit,markdown
      - name: Retain reports and browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tester-army-${{ matrix.project }}
          path: ${{ matrix.project }}/tester-army/.e2e/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
