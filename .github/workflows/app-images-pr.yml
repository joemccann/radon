name: App-plane images (PR)

# Build-only image contract for pull requests. Calls the reusable workflow
# with a read-only token: the push steps in app-images.yml are gated to
# main-push events, so a PR build must never hold packages:write.

on:
  pull_request:
    # Not a required status check, so a skipped run cannot hold a merge.
    # Each prefix is proven to hold no input of any job in app-images.yml
    # (docker context, step scripts, release label) by
    # scripts/tests/test_app_images_pr_paths.py. cloud/** is not: the python
    # job runs cloud/scripts/check_model_transport.py.
    paths-ignore:
      - 'docs/**'
      - 'site/**'
      - 'scripts/tests/**'
      - 'web/tests/**'
      - 'web/e2e/**'
      - 'cloud/tests/**'

permissions:
  contents: read

jobs:
  images:
    uses: ./.github/workflows/app-images.yml
