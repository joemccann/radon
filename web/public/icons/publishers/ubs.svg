<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <rect width="24" height="24" rx="3" fill="#E60000"/>
  <!-- UBS Three Keys Symbol -->
  <g fill="#FFFFFF">
    <!-- Center vertical key -->
    <circle cx="12" cy="7" r="2.5" stroke="#E60000" stroke-width="1.2"/>
    <rect x="11.2" y="7" width="1.6" height="9"/>
    <rect x="12.8" y="13" width="1.5" height="1.2"/>
    <rect x="12.8" y="15" width="1.5" height="1.2"/>
    <!-- Left angled key -->
    <path d="M7.5 9.5l3.5 6.5" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round"/>
    <!-- Right angled key -->
    <path d="M16.5 9.5l-3.5 6.5" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round"/>
  </g>
</svg>
