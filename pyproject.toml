[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501"]  # line length handled separately

[tool.ruff.lint.isort]
known-first-party = ["utils", "trade_blotter"]

[tool.pytest.ini_options]
# Pin import roots so collection is cwd-independent. Without this, running
# pytest from inside scripts/ (or a CI job that cd's there) silently loses
# modules that resolve `import ib_sync` / `from api.*` / `trade_blotter`.
# Do NOT add `testpaths` — it would orphan scripts/trade_blotter/test_*.py
# (29 tests) and the root tests/ money-math suite. Keep collection broad.
# (scripts/test_ib_realtime.py is a MANUAL live-connectivity harness — pytest
# collects 0 tests from it (exit 5); broad collection is not what keeps it
# runnable. T-054.)
pythonpath = [".", "scripts", "scripts/trade_blotter"]
# cloud/ has its own tests/ package (former radon-cloud). Collecting it with
# the app suite collides on import path `tests.conftest`. Run cloud tests via
# `pytest cloud/tests` (CI job step). Also skip agent worktrees and web trees.
norecursedirs = [
    ".git",
    ".venv",
    ".claude",
    "node_modules",
    "web",
    "cloud",
    "site",
    "video",
    "data",
]
# Skip live integration tests by default — they hit real MenthorQ over the
# network (90 tests, ~600s, require credentials). The fast unit suite runs in
# ~14s. Opt back in with `pytest -m integration` on a credentialed host.
addopts = "-m 'not integration'"
markers = [
    "integration: live tests hitting real MenthorQ (requires credentials)",
]

